[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
biblatex = "0.12"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
expect-test = "1"
ignore = "0.4"
imbl = "7"
lsp-server = "0.10"
lsp-types = "0.95"
minijinja = { version = "2", features = ["loader"] }
# Pinned to morg main after the M1 merge (spans, cite, anchor, saphyr).
# For local development against the sibling checkout, add to Cargo.toml:
#   [patch."https://github.com/bloboss/morg"]
#   morg-parser = { path = "../morg/crates/morg-parser" }
morg-parser = { git = "https://github.com/bloboss/morg", rev = "151231a7a1d54fd332dacaa2faf423a1e85e8618" }
notify = "8"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = "1"

morog-bib = { path = "crates/morog-bib" }
morog-index = { path = "crates/morog-index" }
morog-lsp = { path = "crates/morog-lsp" }
morog-sema = { path = "crates/morog-sema" }
